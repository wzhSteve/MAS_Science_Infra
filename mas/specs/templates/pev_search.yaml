label: 检索 PEV（wiki / bing / fetch）
schema_version: "0.3"
topology: centralized
entry_agent: planner
hub:
  role: planner
  skills: []
tools:
  - wikipedia_search
  - bing_search
  - web_fetch
agents:
  - id: planner
    kind: planner
    role: planner
    system_prompt: "选出检索 tool-agent。web_fetch 必须给出 url。只输出 JSON。"
    tools:
      - wikipedia_search
      - bing_search
      - web_fetch
    trainable: true
  - id: wikipedia_search
    kind: tool
    trainable: false
  - id: bing_search
    kind: tool
    trainable: false
  - id: web_fetch
    kind: tool
    trainable: false
  - id: verifier
    kind: verifier
    trainable: true
    system_prompt: "根据 tool-agent 输出判断子目标是否完成，只输出 JSON。"
routers:
  - id: route_exec
    candidates:
      - wikipedia_search
      - bing_search
      - web_fetch
    strategy: from_plan
    output_contract: json
edges:
  - from: planner
    to: route_exec
    kind: route
  - from: route_exec
    to: verifier
    kind: message
  - from: verifier
    to: planner
    kind: feedback
