label: 中心化 PEV + Router
schema_version: "0.3"
topology: centralized
entry_agent: planner
hub:
  role: planner
  skills: []
  max_feedback_hops: 5
tools:
  - wikipedia_search
  - bing_search
  - web_fetch
  - python_coder
  - think
agents:
  - id: planner
    kind: planner
    role: planner
    system_prompt: "把题目拆成下一步，选出 tool-agent 或并行子任务。只输出 JSON：next, args, sub_goal, done。"
    tools:
      - wikipedia_search
      - bing_search
      - web_fetch
      - python_coder
      - think
    trainable: true
  - id: wikipedia_search
    kind: tool
    trainable: false
  - id: bing_search
    kind: tool
    trainable: false
  - id: web_fetch
    kind: tool
    trainable: false
  - id: python_coder
    kind: tool
    trainable: false
  - id: think
    kind: tool
    trainable: false
  - id: verifier
    kind: verifier
    trainable: true
    system_prompt: "根据 tool-agent 输出判断子目标是否完成，只输出 JSON。"
routers:
  - id: route_exec
    candidates:
      - wikipedia_search
      - bing_search
      - web_fetch
      - python_coder
      - think
    strategy: from_plan
    output_contract: json
edges:
  - from: planner
    to: route_exec
    kind: route
  - from: route_exec
    to: verifier
    kind: message
  - from: verifier
    to: planner
    kind: feedback
