profile: fast
algo: grpo
n_runners: 1
rollout_per_gpu: 2
devices:
  ids:
  - 0
model_path: /root/autodl-tmp/MAS_Science_Infra/LLM/Qwen3-4B
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  tir_algo: grpo
  tir:
    initial_rollouts: 1
    beam_size: 2
    branch_probability: 0.5
    entropy_weight: 0.5
    entropy_threshold: 0.15
    entropy_tokens: 8
    gamma: 1
    info_gain_type: log_prob_diff
    step_advantage_w: 1
    gigpo_mode: mean_std
    entropy_adv_coef: 0.1
    aepo_beta: 1
    branch_penalty_slope: 0.25
    multi_tool_bonus: 0.1
    max_branch_depth: 2
    expand_in_runner: true
    use_official_arpo_gate: true
    sites:
    - id: site_after_turn_hub
      enabled: true
      anchor:
        kind: after_agent_turn
        agent_id: hub
        tool_id: null
        edge_id: null
      when: first
      gate:
        type: entropy_delta
        params: {}
      fork:
        beam_size: 2
        share_observation: true
        resume_mode: messages
      reward:
        scheme: scalar_grpo
      priority: 10
    zero_prefix_adv_for_children: true
    ready_batch: false
    rae_p_plus: 0.8
    rae_k_min: 2
    rae_epsilon_f: 0.001
    rae_full_tgt: false
    rae_dead_end_backprop: true
    rae_dead_end_depth: 1
data:
  train_files: /root/autodl-tmp/MAS_Science_Infra/data/train.parquet
  val_files: /root/autodl-tmp/MAS_Science_Infra/data/val.parquet
  train_batch_size: 2
  max_prompt_length: 2048
  max_response_length: 512
  truncation: error
actor_rollout_ref:
  rollout:
    tensor_model_parallel_size: 1
    n: 2
    log_prob_micro_batch_size_per_gpu: 1
    multi_turn:
      format: hermes
    name: vllm
    gpu_memory_utilization: 0.35
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1.0e-06
    use_kl_loss: false
    kl_loss_coef: 0
    entropy_coeff: 0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
  ref:
    log_prob_micro_batch_size_per_gpu: 1
  model:
    path: /root/autodl-tmp/MAS_Science_Infra/LLM/Qwen3-4B
    use_remove_padding: true
    enable_gradient_checkpointing: true
trainer:
  n_gpus_per_node: 1
  val_before_train: false
  critic_warmup: 0
  logger:
  - console
  - tensorboard
  project_name: AgentLightning
  experiment_name: tir_agent_arpo_grpo
  nnodes: 1
  test_freq: 1
  total_epochs: 1
  total_training_steps: 1
