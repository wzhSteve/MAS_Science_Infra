schema_version: '0.3'
topology: centralized
entry_agent: planner
hub:
  role: planner
  skills: []
  max_feedback_hops: 6
  system_prompt: EPC-AW planner window. Output JSON next/args/sub_goal/done.
agents:
- id: planner
  kind: planner
  role: planner
  label: epc_aw_planner
  trainable: true
  system_prompt: Wrap EPC-AW Planner.generate_next_step. next is the executor window.
  tools: []
  profile:
    backend: user_space
    user_project: epc-aw-main
  meta:
    origin: user
    user_project: epc-aw-main
    wraps: EPC-AW.Planner
- id: u_epc-aw-main__executor
  kind: blank
  role: executor
  label: epc_aw_executor
  trainable: false
  system_prompt: Wrap EPC-AW Executor window (tool command + execute).
  profile:
    backend: user_space
    user_project: epc-aw-main
    llm_required: false
  meta:
    origin: user
    user_project: epc-aw-main
    wraps: EPC-AW.Executor
- id: verifier
  kind: verifier
  role: verifier
  label: epc_aw_verifier
  trainable: false
  system_prompt: Wrap EPC-AW Diagnoser.verificate_context.
  profile:
    backend: user_space
    user_project: epc-aw-main
  meta:
    origin: user
    user_project: epc-aw-main
    wraps: EPC-AW.Diagnoser
routers: []
edges:
- from: planner
  to: u_epc-aw-main__executor
  kind: message
- from: u_epc-aw-main__executor
  to: verifier
  kind: message
- from: verifier
  to: planner
  kind: feedback
llm:
  kind: local
  model: Qwen3-4B
  base_url: http://127.0.0.1:8001/v1
