# EPC-AW paper profile; launch with SCIENCE_EPC_AW_PROFILE=paper.
profile: a800_1gpu
algo: grpo
n_runners: 2
rollout_per_gpu: 4
devices:
  ids:
  - 0
model_path: /root/autodl-tmp/MAS_Science_Infra/LLM/Qwen3-4B
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  tir_algo: grpo
data:
  train_files: /root/autodl-tmp/MAS_Science_Infra/data/train.parquet
  val_files: /root/autodl-tmp/MAS_Science_Infra/data/val.parquet
  train_batch_size: 2
  max_prompt_length: 8192
  max_response_length: 2048
  truncation: left
actor_rollout_ref:
  rollout:
    tensor_model_parallel_size: 1
    n: 4
    log_prob_micro_batch_size_per_gpu: 1
    name: vllm
    gpu_memory_utilization: 0.35
    engine_kwargs:
      vllm:
        enable_auto_tool_choice: true
        tool_call_parser: hermes
        max_model_len: 12288
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1.0e-06
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: true
  model:
    path: /root/autodl-tmp/MAS_Science_Infra/LLM/Qwen3-4B
    use_remove_padding: true
    enable_gradient_checkpointing: true
trainer:
  n_gpus_per_node: 1
  val_before_train: false
  critic_warmup: 0
  logger:
  - console
  - tensorboard
  project_name: epc_aw_4b
  experiment_name: epc_paper_grpo_4b_3step
  nnodes: 1
  test_freq: -1
  total_epochs: 1
  total_training_steps: 3
  save_freq: -1
