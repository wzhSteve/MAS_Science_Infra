profile: a800_2gpu
algo: appo
n_runners: 2
rollout_per_gpu: 4
devices:
  ids:
  - 0
  - 1
model_path: /root/autodl-tmp/MAS_Science_Infra/LLM/Qwen3-4B
algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  tir_algo: appo
  tir:
    initial_rollouts: 2
    beam_size: 2
    branch_probability: 0.5
    entropy_weight: 0.5
    max_branch_depth: 2
    use_official_arpo_gate: true
    loss_mode: future_kl
    reward_scale_discount: 0.9
data:
  train_files: /root/autodl-tmp/MAS_Science_Infra/data/train.parquet
  val_files: /root/autodl-tmp/MAS_Science_Infra/data/val.parquet
  train_batch_size: 2
  max_prompt_length: 4096
  max_response_length: 1024
  truncation: left
actor_rollout_ref:
  rollout:
    tensor_model_parallel_size: 1
    n: 4
    log_prob_micro_batch_size_per_gpu: 1
    name: vllm
    gpu_memory_utilization: 0.2
    engine_kwargs:
      vllm:
        enable_auto_tool_choice: true
        tool_call_parser: hermes
        max_model_len: 8192
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    optim:
      lr: 1.0e-06
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    fsdp_config:
      param_offload: false
      optimizer_offload: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      param_offload: false
  model:
    path: /root/autodl-tmp/MAS_Science_Infra/LLM/Qwen3-4B
    use_remove_padding: true
    enable_gradient_checkpointing: true
trainer:
  n_gpus_per_node: 2
  val_before_train: false
  critic_warmup: 0
  logger:
  - console
  - tensorboard
  project_name: rl_gpu_gate
  experiment_name: appo_futkl_4b_2gpu_3step
  nnodes: 1
  test_freq: -1
  total_epochs: 1
  total_training_steps: 3
  save_freq: -1
