[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "science-infra"
version = "0.1.0"
description = "MAS Research Infrastructure: Archive-driven MAS ↔ RL bridge"
readme = "design.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# live collect / TirAgent（对齐 AgentFlow agent extra 的核心栈）
live = [
  "langchain>=0.3,<0.4",
  "langchain-core>=0.3,<0.4",
  "langchain-openai>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langgraph>=0.6,<0.7",
  "openai>=1.0",
  "requests>=2.28",
  "beautifulsoup4>=4.12",
]
rl = [
  "agentlightning>=0.3.0",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
science-infra = "science_infra.ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["science_infra*"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["agent-lightning/examples/tir_agent/tests"]
pythonpath = [".", "agent-lightning/examples/tir_agent"]
addopts = "-q"
