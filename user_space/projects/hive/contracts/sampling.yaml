mode: arpo
group_n: 4
beam_size: 2
sites:
- id: after_planner
  enabled: true
  anchor:
    kind: after_agent_turn
    agent_id: planner
  gate:
    type: always
  fork:
    beam_size: 2
    resume_mode: messages
- id: after_route_exec
  enabled: true
  anchor:
    kind: after_agent_turn
    agent_id: route_exec
  gate:
    type: always
  fork:
    beam_size: 2
    resume_mode: messages
- id: after_verifier
  enabled: true
  anchor:
    kind: after_verifier
    agent_id: verifier
  gate:
    type: always
  fork:
    beam_size: 2
    resume_mode: messages
