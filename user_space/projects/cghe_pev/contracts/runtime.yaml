n: 1
max_steps: 10
# Training episodes stop at the AgentFlow paper cap. Eval keeps max_steps.
train_max_steps: 10
max_time: 1800
max_tokens: 4096
temperature: 0.7
memory_result_chars: 4000
sft_prompts: true
enabled_tools:
- Base_Generator_Tool
- Python_Coder_Tool
- Bing_Search_Tool
- Web_Fetch_Tool
# CGHE. enabled false keeps the original Planner–Executor–Verifier windows.
cghe:
  enabled: true
  n: 10
  confidence_threshold: 1.0
  sqlite_path: artifacts/cghe_evidence.sqlite
  recovery_rounds: 2
  tool_calls: 12
  replans: 1
  pruning: true
  shared_priority: true
  isolate_memory: false
  # v1 keeps shared-node recovery. v2 enables constraint inference, EPV and counterfactuals.
  algorithm: v1
  lambda_cost: 0.0
  mu_risk: 0.0
  epv_threshold: 0.0
  max_step1_attempts: 3
  max_regenerations: 2
  max_total_step1_attempts: 12
  selection:
    strategy: max_step1_path_coverage
  pruning_gates:
    require_verified_counterexample: true
    require_direct_observation: true
    require_complete_scope: true
    prune_only_explicitly_dependent_plans: true
