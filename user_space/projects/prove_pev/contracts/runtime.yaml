n: 1
max_steps: 10
# Training episodes stop at the AgentFlow paper cap. Eval keeps max_steps.
train_max_steps: 10
max_time: 1800
max_tokens: 4096
temperature: 0.7
memory_result_chars: 4000
sft_prompts: true
enabled_tools:
- Base_Generator_Tool
- Python_Coder_Tool
- Bing_Search_Tool
- Web_Fetch_Tool
# MAS-ProVe process verification on PEV (Best-of-N + LLM-as-a-Judge).
# enabled: false → behavior matches frozen pure_pev.
prove:
  enabled: true
  n: 3
  granularity: plan
  candidate_temperature: 0.7
  judge_backend: inline
  judge_model: null
  context_mode: full_memory
  task_type: qa
